name: Deploy to Cloud Run

on:

  workflow_dispatch:

# !!! push:
# !!!
# !!!   branches:
# !!! - 'main'
# !!! - 'next'
# !!! - 'yard'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PROJECT: ec2u-data
  REGION: europe-west1

jobs:

  deploy:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: server
            vars: ""
            flags: --allow-unauthenticated
          - service: loader # invoked only by Cloud Scheduler, with the attempt deadline of its jobs (see .claude/deployment.md)
            vars: ""
            flags: --no-allow-unauthenticated --timeout=30m

    env:
      IMAGE: europe-west1-docker.pkg.dev/ec2u-data/pipe/${{ matrix.service }}-${{ github.ref_name }}
      SERVICE: ${{ matrix.service }}-${{ github.ref_name }}

    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      - id: auth
        name: Sign in to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/891057038566/locations/global/workloadIdentityPools/github/providers/ec2u
          service_account: pipe-deployer@ec2u-data.iam.gserviceaccount.com
          token_format: access_token

      - name: Sign in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Deploy service
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            PIPE_ENVIRONMENT=${{ github.ref_name }}
            ${{ matrix.vars }}
          env_vars_update_strategy: overwrite
          flags: >-
            --clear-secrets
            --service-account=${{ env.SERVICE }}@ec2u-data.iam.gserviceaccount.com
            ${{ matrix.flags }}
            --min-instances=0
            --max-instances=3

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Delete superseded revisions
        run: |
          serving=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT}" \
            --format="value(status.latestReadyRevisionName)")
          gcloud run revisions list --service "${SERVICE}" --region "${REGION}" --project "${PROJECT}" \
            --format="value(metadata.name)" \
            | grep -vx "${serving}" \
            | xargs -r -n 1 gcloud run revisions delete --region "${REGION}" --project "${PROJECT}" --quiet
